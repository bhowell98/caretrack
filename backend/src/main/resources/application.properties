spring.application.name=CareTrack

spring.datasource.url=jdbc:h2:file:./data/caretrack;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

caretrack.jwt.secret=ChangeThisDevSecretKeyToAtLeastThirtyTwoChars!!
caretrack.jwt.expiration-ms=604800000
